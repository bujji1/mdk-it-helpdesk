name: CD - Deploy to Azure

# Runs after every merge into main: build, test, publish, then deploy to Azure App Service.
# Required repo settings:
#   - Variable: AZURE_WEBAPP_NAME            (the App Service name)
#   - Secret:   AZURE_WEBAPP_PUBLISH_PROFILE (contents of the downloaded publish profile)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test
        run: dotnet test --configuration Release

      - name: Publish web app
        run: dotnet publish src/MdkHelpdesk.Web --configuration Release --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
