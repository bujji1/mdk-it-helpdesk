name: CI - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Verify EF Core migrations match the model
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.15
          dotnet ef migrations has-pending-model-changes --project src/MdkHelpdesk.Infrastructure --startup-project src/MdkHelpdesk.Web --configuration Release --no-build

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal
